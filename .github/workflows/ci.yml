name: Continuous Integration

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.*
          11.0.*
      env:
        DOTNET_NOLOGO: 1
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build -v n /p:CollectCoverage=true /p:CoverletOutput='../../' /p:CoverletOutputFormat=opencover /p:Threshold=91 /p:SkipAutoProps=true /p:UseSourceLink=true
    - name: AOT smoke test
      run: |
        dotnet publish tests/smoke/TaskTupleAwaiter.AotSmokeTest -c Release -r win-x64 -o aot-out --no-restore
        .\aot-out\TaskTupleAwaiter.AotSmokeTest.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      shell: pwsh
