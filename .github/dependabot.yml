version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
  # NuGet: security updates only. open-pull-requests-limit: 0 disables routine version-bump
  # PRs, while Dependabot security updates (enabled in repo settings) still open PRs for
  # packages with a known vulnerability. Floating versions (e.g. 4.*) already track latest.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
